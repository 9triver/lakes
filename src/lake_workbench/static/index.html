<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>湖泊工作台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand-row">
            <h1>湖泊工作台</h1>
            <select id="region-select" aria-label="省份"></select>
          </div>
          <div class="sidebar-tabs" role="tablist" aria-label="侧栏视图">
            <button id="tab-lakes" type="button" class="active">湖泊</button>
            <button id="tab-training" type="button">训练集</button>
            <button id="tab-model" type="button">模型验证</button>
          </div>
          <section id="lake-sidebar-panel">
          <input id="search" type="search" placeholder="搜索名称 / OSM ID" autocomplete="off" />
          <div class="filters">
            <select id="filter-type" aria-label="水体类型">
              <option value="">全部类型</option>
              <option value="lake">湖泊</option>
              <option value="reservoir">水库</option>
              <option value="pond">坑塘</option>
              <option value="pond_candidate">疑似坑塘</option>
              <option value="wetland">湿地</option>
              <option value="aquaculture">养殖水面</option>
              <option value="unknown">未分类</option>
            </select>
            <select id="filter-area" aria-label="面积">
              <option value="">全部面积</option>
              <option value="gte100">≥100 km²</option>
              <option value="10_100">10-100 km²</option>
              <option value="1_10">1-10 km²</option>
              <option value="0_1_1">0.1-1 km²</option>
              <option value="lt0_1">&lt;0.1 km²</option>
            </select>
            <select id="filter-name" aria-label="名称">
              <option value="">全部名称</option>
              <option value="true">有名称</option>
              <option value="false">无名称</option>
            </select>
            <select id="filter-tci" aria-label="影像">
              <option value="">全部影像</option>
              <option value="true">有影像</option>
              <option value="false">无影像</option>
            </select>
            <select id="filter-polygon-quality" aria-label="边界质量">
              <option value="">全部边界质量</option>
              <option value="high">边界 high</option>
              <option value="medium">边界 medium</option>
              <option value="low">边界 low</option>
            </select>
            <select id="filter-metadata-quality" aria-label="元数据质量">
              <option value="">全部元数据质量</option>
              <option value="high">元数据 high</option>
              <option value="medium">元数据 medium</option>
              <option value="low">元数据 low</option>
            </select>
          </div>
          <div id="count" class="count">加载中</div>
          </section>
          <section id="training-sidebar-panel" class="training-sidebar-panel" hidden>
            <div id="training-summary" class="count">训练集未加载</div>
            <div class="training-view-tabs" role="tablist" aria-label="训练集视图">
              <button id="training-view-samples" type="button" class="active">样本</button>
              <button id="training-view-patches" type="button">Patch</button>
              <button id="training-view-train" type="button">训练</button>
            </div>
            <div id="patch-controls" class="patch-controls" hidden>
              <select id="patch-include-filter" aria-label="Patch 状态">
                <option value="">全部 Patch</option>
                <option value="included">已包含</option>
                <option value="excluded">已排除</option>
              </select>
              <select id="patch-water-filter" aria-label="Patch 水体">
                <option value="">全部内容</option>
                <option value="water">含水体</option>
                <option value="negative">无水体</option>
              </select>
            </div>
            <div id="patch-export-controls" class="patch-export-controls" hidden>
              <label class="patch-export-field">
                <span>Patch 尺寸</span>
                <input id="patch-size" type="number" min="64" max="1024" step="64" value="256" aria-label="Patch 尺寸" />
              </label>
              <label class="patch-export-field">
                <span>步长</span>
                <input id="patch-stride" type="number" min="32" max="1024" step="32" value="128" aria-label="Patch 步长" />
              </label>
              <label class="patch-export-field">
                <span>预览倍率</span>
                <input id="patch-preview-scale" type="number" min="1" max="4" step="1" value="2" aria-label="预览倍率" />
              </label>
              <label class="patch-export-check" title="删除同参数输出目录后重新生成；不勾选时会尽量保留已有 include/exclude 状态">
                <input id="patch-overwrite" type="checkbox" />
                <span>覆盖重建</span>
              </label>
              <button id="patch-export" class="load-more compact" type="button">生成 Patch</button>
              <div id="patch-export-status" class="count">未生成</div>
            </div>
            <div id="training-run-controls" class="training-run-controls" hidden>
              <label class="patch-export-field">
                <span>模型名称</span>
                <input id="train-run-name" type="text" value="" placeholder="自动生成" aria-label="模型名称" />
              </label>
              <label class="patch-export-field">
                <span>轮数</span>
                <input id="train-epochs" type="number" min="1" max="500" step="1" value="30" aria-label="训练轮数" />
              </label>
              <label class="patch-export-field">
                <span>Batch</span>
                <input id="train-batch-size" type="number" min="1" max="128" step="1" value="8" aria-label="Batch size" />
              </label>
              <label class="patch-export-field">
                <span>学习率</span>
                <input id="train-lr" type="number" min="0.000001" max="1" step="0.0001" value="0.001" aria-label="学习率" />
              </label>
              <label class="patch-export-field">
                <span>模型宽度</span>
                <input id="train-base-channels" type="number" min="4" max="128" step="4" value="32" aria-label="模型宽度" />
              </label>
              <label class="patch-export-field">
                <span>设备</span>
                <select id="train-device" aria-label="训练设备">
                  <option value="cuda">GPU</option>
                  <option value="auto">自动</option>
                  <option value="cpu">CPU</option>
                </select>
              </label>
              <label class="patch-export-check">
                <input id="train-no-augment" type="checkbox" />
                <span>关闭增强</span>
              </label>
              <button id="train-start" class="load-more compact" type="button">开始训练</button>
              <button id="train-cancel" class="load-more compact danger" type="button" disabled>取消训练</button>
              <div id="train-status" class="count">未开始</div>
            </div>
            <button id="training-refresh" class="load-more compact" type="button">刷新</button>
          </section>
          <section id="model-sidebar-panel" class="model-sidebar-panel" hidden>
            <div id="model-summary" class="count">模型验证未运行</div>
            <select id="model-select" class="model-select" aria-label="模型权重"></select>
            <div id="model-detail" class="model-detail"></div>
            <button id="model-random" class="load-more compact" type="button">随机验证一个湖泊</button>
          </section>
        </div>
        <div id="lake-list" class="lake-list"></div>
        <div id="training-list" class="training-list" hidden></div>
        <button id="load-more" class="load-more" type="button" hidden>加载更多</button>
      </aside>
      <section class="viewer">
        <header class="toolbar">
          <div>
            <h2 id="lake-title">选择一个湖泊</h2>
            <div id="lake-subtitle" class="muted">可见光影像和 polygon 会在这里显示</div>
          </div>
          <div class="tools">
            <div class="tool-group">
              <label><input id="toggle-image" type="checkbox" checked /> 影像</label>
              <label><input id="toggle-tile-grid" type="checkbox" checked /> Tile</label>
            </div>
            <div class="tool-group">
              <label><input id="toggle-osm" type="checkbox" checked /> OSM</label>
              <label><input id="toggle-hydro" type="checkbox" checked /> HydroLAKES</label>
              <label><input id="toggle-context-water" type="checkbox" checked /> 其他</label>
              <label><input id="toggle-esa" type="checkbox" checked /> ESA 平滑</label>
            </div>
            <div class="tool-group jrc-tool">
              <label><input id="toggle-jrc" type="checkbox" checked /> JRC</label>
              <input id="jrc-threshold" type="range" min="1" max="100" step="1" value="75" aria-label="JRC 阈值" />
              <span id="jrc-threshold-value">75%</span>
            </div>
            <div id="model-prediction-tool" class="tool-group" hidden>
              <label><input id="toggle-model-prediction" type="checkbox" checked /> 模型预测</label>
            </div>
            <div class="tool-group local-label-tool">
              <label><input id="toggle-local-label" type="checkbox" checked /> 本地水体标注</label>
              <select id="local-label-select" class="layer-select" aria-label="本地水体标注" disabled>
                <option value="">无本地标注</option>
              </select>
            </div>
            <div class="tool-group fit-tool">
              <button id="zoom-lake" type="button">水体</button>
              <button id="zoom-tile" type="button">Tile</button>
            </div>
          </div>
        </header>
        <section id="lake-controls" class="lake-controls" hidden>
          <div id="sentinel-panel" class="sentinel-panel" hidden>
            <div class="control-group imagery-select-control">
              <select id="sentinel-tile" aria-label="Sentinel tile"></select>
              <select id="imagery-product" aria-label="本地影像"></select>
              <button id="imagery-apply" type="button">设为影像</button>
            </div>
            <div class="control-group sentinel-query-control">
              <input id="sentinel-start" type="date" aria-label="开始日期" />
              <input id="sentinel-end" type="date" aria-label="结束日期" />
              <label class="cloud-input">云量 ≤ <input id="sentinel-cloud" type="number" min="0" max="100" step="1" value="50" />%</label>
              <button id="sentinel-query" type="button">查询产品</button>
            </div>
            <div id="sentinel-products" class="sentinel-products"></div>
          </div>
          <div id="training-panel" class="training-panel control-group" hidden>
            <input id="training-notes" type="text" aria-label="备注" placeholder="备注" />
            <button id="training-save" type="button" disabled>记录当前视图为训练区域</button>
            <div id="training-status" class="training-status"></div>
          </div>
        </section>
        <section id="patch-review" class="patch-review" hidden>
          <div class="patch-review-head">
            <div>
              <h2>Patch 审核</h2>
              <div id="patch-review-summary" class="muted">暂无 patch</div>
            </div>
            <div class="patch-pager">
              <button id="patch-prev" type="button">上一页</button>
              <span id="patch-page-label">1 / 1</span>
              <button id="patch-next" type="button">下一页</button>
            </div>
          </div>
          <div id="patch-grid" class="patch-grid"></div>
        </section>
        <section id="training-run-view" class="training-run-view" hidden>
          <div class="patch-review-head">
            <div>
              <h2>模型训练</h2>
              <div id="training-run-summary" class="muted">未开始</div>
            </div>
          </div>
          <div id="training-run-body" class="training-run-body"></div>
        </section>
        <div id="map-wrap" class="map-wrap">
          <div id="empty" class="empty">从左侧列表选择湖泊</div>
          <div id="loading" class="loading" hidden>
            <div class="spinner"></div>
            <div id="loading-text">加载中</div>
          </div>
          <div id="map" class="map"></div>
        </div>
        <footer id="meta" class="meta"></footer>
      </section>
    </main>
    <div id="patch-modal" class="patch-modal" hidden>
      <div class="patch-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="patch-modal-title">
        <div class="patch-modal-head">
          <div>
            <h2 id="patch-modal-title">Patch 预览</h2>
            <div id="patch-modal-subtitle" class="muted"></div>
          </div>
          <button id="patch-modal-close" type="button" aria-label="关闭">关闭</button>
        </div>
        <div class="patch-modal-body">
          <div class="patch-modal-image-wrap">
            <img id="patch-modal-image" alt="" />
          </div>
          <div class="patch-modal-info">
            <div id="patch-modal-meta" class="patch-modal-meta"></div>
            <button id="patch-modal-toggle" type="button"></button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
