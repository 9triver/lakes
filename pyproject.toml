[project]
name = "lakes"
version = "0.1.0"
description = "Multi-region lake imagery, annotation, and water-segmentation workbench."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyJWT[crypto]>=2.10",
  "geopandas>=1.0",
  "pyogrio>=0.8",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "shapely>=2.0",
  "torch==2.8.0+cu129",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.scripts]
lakes-workbench = "lake_workbench.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lake_workbench = ["static/*", "static/**/*"]
